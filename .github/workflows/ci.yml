name: CI

on:
  push:
    branches: [main, 'docs/**', 'feat/**', 'fix/**']
  pull_request:

# One run per ref. A superseded push is wasted CI and a confusing red X.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── The plan gates. Cheap, and they fail fastest. ──────────────────────
  plan:
    name: plan gates (traceability, policies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }

      # No orphan requirement, no broken citation, no requirement without a
      # story or a milestone. 13-testing-quality.md §10.
      - name: traceability
        run: node scripts/traceability.mjs

      # 03-permissions-rls.md is only true if it matches the database, and
      # nothing else checks that it does.
      - name: policy diff
        run: node scripts/policy-diff.mjs

      # The matrix is generated. A committed matrix that differs from a fresh
      # run means someone hand-edited it.
      - name: traceability matrix is current
        run: git diff --exit-code docs/plan/TRACEABILITY.md

  lint:
    name: types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  # ── The design-system gates (DEC-087). Cheap: a TSX parse and a directory
  # walk, no server and no build, so they sit beside lint rather than in the
  # heavy jobs. Both carry a committed allowlist that MAY ONLY SHRINK — 106
  # files hold 425 pre-existing violations today and 43 of the 49 pages have
  # no loading boundary, so a gate that hard-failed from M9 would block every
  # PR until M13. They flip to --strict in M13.
  system:
    name: design system gates (ui-lint, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci

      # REQ-UIX-001: no screen declares its own control styles, and no <input>
      # lives outside <Field>. Excludes src/components/ui/ for BOTH rules —
      # without that it fails the primitives it exists to protect.
      - name: ui-lint
        run: npm run ui-lint

      # REQ-UIX-005: every segment with a page has a loading.tsx at or above
      # it. "At or above" is the whole point — a dozen files, not forty-nine.
      - name: loading-coverage
        run: npm run loading-coverage

      # REQ-UIX-016: the same walk for error.tsx, a not-found.tsx per dynamic
      # segment, and global-error.tsx carrying dir="rtl" — the one file in the
      # product with no translation provider above it.
      - name: error-coverage
        run: npm run error-coverage

      # An allowlist that grew is a gate that was worked around.
      - name: the allowlists did not grow
        run: git diff --exit-code scripts/ui-lint-allowlist.json scripts/route-coverage-allowlist.json

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx vitest run

  # ── RLS. Armed now, meaningful from M1. ───────────────────────────────
  rls:
    name: RLS policies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci

      # DEC-025: CI uses an ephemeral Postgres container, not a hosted project.
      # The isolation sweep is generated over every entity, so a new table is
      # covered the day it is created (03 §8.1).
      # The migrations grant to `anon` and `authenticated`. A stock postgres
      # image has neither, so 0001 fails before reaching anything testable.
      - name: bootstrap Supabase roles
        env: { PGPASSWORD: postgres }
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/ci/roles.sql

      - name: apply migrations
        env: { PGPASSWORD: postgres }
        run: |
          for f in supabase/migrations/*.sql; do
            echo "-- $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      # DEC-046, 02 §4.17: RPCs enqueue through public.enqueue_job() (0025),
      # which calls graphile-worker's own schema. The library installs it;
      # nothing under supabase/migrations/ models it. Same step as
      # scripts/rls.mjs runs locally after `supabase db reset`.
      - name: install the graphile_worker schema
        run: npx graphile-worker --schema-only -c postgres://postgres:postgres@localhost:5432/postgres

      # The highest-value suite in the product (13 §3): the generated isolation
      # sweep over every table, the per-policy cases from 03 §8.2, the auth
      # hook, the RPCs. Local Supabase is the source of truth; this container
      # runs the identical suite over the shim in scripts/ci/roles.sql.
      - name: RLS suite
        run: npx vitest run --project rls
        env:
          RLS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SUPABASE_URL: http://localhost:54331
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
          FORM_TOKEN_SECRET: ci-placeholder-not-a-real-secret
          # Inlined into the build (M1 platform routes). Placeholders: no real project.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54331
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

      # REQ-DSG-016: the fonts the build just emitted must be exactly the
      # manifest's — the same bytes the worker's Chromium and poppler get.
      # If Google's subset moves under next/font, this is where it shows.
      - name: font set matches the manifest
        run: node scripts/fonts/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          # .next is a dot-directory and upload-artifact skips hidden files by
          # default, so without this the artifact is silently empty and the qa
          # job fails with "Artifact not found".
          include-hidden-files: true

  # ── The frozen public contract. REQ-NFR-019. ───────────────────────────
  qa:
    name: frozen routes (qa)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next }
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with: { chrome-version: stable }

      # npm run qa starts the stub, starts next with SUPABASE_URL pointed at
      # it, and refuses to run against anything that is not localhost
      # (DEC-023). It never reaches a real project.
      - name: qa
        run: npm run qa
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_NO_SANDBOX: '1'

  # ── End to end. REQ-NFR-018. ──────────────────────────────────────────
  e2e:
    name: end to end (playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next }
      - run: npx playwright install --with-deps chromium

      # playwright.config.ts starts scripts/serve-stub.mjs — next start wired
      # to the QA stub — so a test can submit real forms and never reach a
      # real project (DEC-023).
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ── The worker's LISTEN/NOTIFY boot probe. 04 §7.2, 11 §1.2, DEC-034. ──
  # The failure this guards is silent: on a transaction-pooled connection
  # LISTEN succeeds and never delivers. So the probe is run twice — straight
  # at Postgres, where it MUST pass, and through pgbouncer in transaction
  # mode, where it MUST fail. A probe that passes both is a probe that
  # checks nothing.
  worker:
    name: worker probe (session vs transaction pooling)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
      pgbouncer:
        image: edoburu/pgbouncer:latest
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
        ports: ['6432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run worker:build

      - name: probe passes on a session-mode connection
        run: npm run worker:probe
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: probe REFUSES a transaction-pooled connection
        run: |
          if npm run worker:probe; then
            echo "::error::the probe passed through a transaction pooler — it would not catch the silent failure"
            exit 1
          fi
          echo "probe refused the pooled connection, as it must"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:6432/postgres

      # DEC-046: the worker is a host-agnostic image, locally and in CI, until
      # Launch picks the host. Build it and run the same probe INSIDE it, so
      # the image that would ship is the one proven. Built from the repo root
      # (worker/Dockerfile).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          tags: kareem-worker
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the image's probe passes on a session-mode connection
        run: docker run --rm --network host -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres kareem-worker node worker/dist/index.js --probe-only

      # DEC-048: the image now carries headless Chromium, the designer runtime
      # and the font set (REQ-DSG-016). The shaping parity harness runs INSIDE
      # it against the committed goldens, so the Chromium and the font bytes
      # that would render a poster in production are the ones proven here —
      # Tier A is a property of the font bytes and the layout algorithm, not
      # the rasteriser (DEC-028), which is what lets a Linux image match
      # goldens made on a Mac. The sandbox is dropped only inside the
      # container (CHROME_NO_SANDBOX), never on a developer's machine.
      # DEC-058: the fourth export path is poppler's page images, and poppler
      # and cwebp live in this image now (the converter is gone with
      # LibreOffice). All 28 assertions run here; a missing tool would skip
      # seven of them LOUDLY, and this job is where that must never happen.
      - name: the image's Chromium, poppler and fonts pass the shaping parity suite — 28 of 28
        run: >-
          docker run --rm --network host
          -v "$PWD/scripts:/app/scripts:ro"
          -v "$PWD/packages/fonts:/app/packages/fonts:ro"
          -e CHROME_NO_SANDBOX=1
          -e PARITY_REQUIRE_POPPLER=1
          kareem-worker node scripts/parity/harness.mjs

  # ── main stays deployable with the platform unconfigured. DEC-038. ────
  # Production has no NEXT_PUBLIC_ Supabase variables until PR C. This job
  # builds exactly that way and proves the platform routes are 404s while the
  # frozen routes are untouched.
  unconfigured:
    name: platform unconfigured (build + 404s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:unconfigured
        env:
          SUPABASE_URL: http://localhost:54331
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
          FORM_TOKEN_SECRET: ci-placeholder-not-a-real-secret
          CI: 'true'

  # ── Arabic shaping. D66. ───────────────────────────────────────────────
  parity:
    name: shaping parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with: { chrome-version: stable }

      # The goldens are committed from a developer's macOS Chrome, so on this
      # Linux runner the layout and pixel comparisons drop to Tier C
      # (advisory) and the harness says so. What stays BLOCKING here is
      # everything platform-independent: a blank capture, a font that fell
      # back, letter-spacing on Arabic, and render-to-render determinism.
      #
      # Tier B becomes blocking on Linux in M6, when the goldens are
      # regenerated inside the worker image — which DEC-017 already names as
      # the reference environment.
      - name: parity
        run: npm run parity
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # The runner cannot start Chrome's sandbox. Opt in here rather than
          # in the harness, so a developer machine never silently drops it.
          CHROME_NO_SANDBOX: '1'
