<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كريم معرفة — حركة الشعار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
<style>
:root{--ink:#0B0C12;--surface:#151724;--line:#2A2E40;--bone:#F4F1EA;--muted:#A7ABBE;--lime:#C6FF3D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ink);color:var(--bone);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;min-height:100%}
main{max-width:720px;margin:0 auto;padding:32px 20px 60px;display:flex;flex-direction:column;gap:20px;align-items:center}
h1{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:28px;margin:0}
.stage{width:100%;max-width:440px;aspect-ratio:1;border-radius:28px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.km-logo{height:60%;width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--bone);cursor:pointer}
button.primary{background:var(--lime);color:var(--ink);border:0;font-family:'Baloo Bhaijaan 2',sans-serif;font-size:18px}
p{margin:0;color:var(--muted);font-size:14px;text-align:center;max-width:520px}
.km-logo .arc{stroke-dasharray:1;stroke-dashoffset:0}
.km-logo.reveal .arc{stroke-dashoffset:1;animation:draw .62s cubic-bezier(.2,.8,.2,1) forwards}
.km-logo.reveal .coral.face{animation-delay:0ms}.km-logo.reveal .coral.shadow{animation-delay:90ms}
.km-logo.reveal .lime.face{animation-delay:140ms}.km-logo.reveal .lime.shadow{animation-delay:230ms}
.km-logo.reveal .violet.face{animation-delay:280ms}.km-logo.reveal .violet.shadow{animation-delay:370ms}
.km-logo.reveal .orange.face{animation-delay:420ms}.km-logo.reveal .orange.shadow{animation-delay:510ms}
.km-logo.reveal{animation:settle .42s cubic-bezier(.34,1.56,.64,1) 1s both;transform-origin:50% 60%}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes settle{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.km-logo.loading .face{animation:breathe 1.6s ease-in-out infinite}
.km-logo.loading .coral.face{animation-delay:0s}.km-logo.loading .lime.face{animation-delay:.2s}.km-logo.loading .violet.face{animation-delay:.4s}.km-logo.loading .orange.face{animation-delay:.6s}
.km-logo.loading .shadow{opacity:.5}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.km-logo.tap{animation:settle .36s cubic-bezier(.34,1.56,.64,1) both}
@media (prefers-reduced-motion: reduce){.km-logo,.km-logo .arc,.km-logo .face{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
</style>
</head>
<body>
<main>
  <h1>حركة الشعار</h1>
  <div class="stage"><svg class="km-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215.78 294.03" role="img" aria-label="كريم معرفة"><defs><clipPath id="km-clip-a"><path d="M124.1,31.04c0,50.39-41.3,91.16-92.35,91.16L124.1,31.04Z"/></clipPath><clipPath id="km-clip-b"><path d="M118.47,26.68c0,50.39-41.3,91.16-92.35,91.16L118.47,26.68Z"/></clipPath></defs><g id="Layer_1-2" data-name="Layer 1"> <path class="arc coral shadow" d="M52.52,193.11c40.42,5.32,69.11,40.13,64.15,77.83" fill="none" stroke="#ff4d2d" stroke-width="37.83" stroke-linecap="round" pathLength="1"/> <path class="arc coral face" d="M46.9,197.29c40.42,5.32,69.11,40.13,64.15,77.83" fill="none" stroke="#ff6e4f" stroke-width="37.83" stroke-linecap="round" pathLength="1"/> <path class="arc lime shadow" d="M196.47,26.85c0,94.55-76.23,171.06-170.44,171.06" fill="none" stroke="#8eff3d" stroke-width="38.63" stroke-linecap="round" pathLength="1"/> <path class="arc lime face" d="M189.76,19.32c0,94.55-76.23,171.06-170.44,171.06" fill="none" stroke="#c6ff3d" stroke-width="38.63" stroke-linecap="round" pathLength="1"/> <path class="arc violet shadow" d="M25.22,123.17c83.56-6.87,157.01,58.54,164.22,146.25" fill="none" stroke="#9b61ff" stroke-width="38.63" stroke-linecap="round" pathLength="1"/> <path class="arc violet face" d="M30.7,118.59c83.56-6.87,157.01,58.54,164.22,146.25" fill="none" stroke="#9b7cff" stroke-width="38.63" stroke-linecap="round" pathLength="1"/> <g> <g clip-path="url(#km-clip-a)"> <path class="arc orange shadow" d="M124.1,31.04c0,50.39-41.3,91.16-92.35,91.16" fill="none" stroke="#d48300" stroke-width="23" stroke-linecap="round" pathLength="1"/> </g> <path class="arc orange shadow" d="M124.1,31.04c0,50.39-41.3,91.16-92.35,91.16" fill="none" stroke="#d48300" stroke-width="38.63" stroke-linecap="round" pathLength="1"/> </g> <g> <g clip-path="url(#km-clip-b)"> <path class="arc orange face" d="M118.47,26.68c0,50.39-41.3,91.16-92.35,91.16" fill="none" stroke="#ff9a2e" stroke-width="23" stroke-linecap="round" pathLength="1"/> </g> <path class="arc orange face" d="M118.47,26.68c0,50.39-41.3,91.16-92.35,91.16" fill="none" stroke="#ff9a2e" stroke-width="38.63" stroke-linecap="round" pathLength="1"/> </g> </g></svg></div>
  <div class="row">
    <button class="primary" data-play="reveal">الظهور</button>
    <button data-play="loading">التحميل</button>
    <button data-play="tap">نقرة</button>
    <button data-play="">إيقاف</button>
  </div>
  <p>الظهور: الأقواس تُرسم بالتتابع، الظل يلحق بـ 90 مللي ثانية، ثم استقرار واحد — 1.4 ثانية. عند الدخول وبدء التشغيل فقط.</p>
  <p>التحميل: الأقواس تتنفّس بالتتابع، مكان كل مؤشر تحميل. النقرة: ارتداد واحد. مع تقليل الحركة: ثابت.</p>
</main>
<script>
const logo=document.querySelector('.km-logo');
document.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',()=>{logo.classList.remove('reveal','loading','tap');void logo.getBoundingClientRect();if(b.dataset.play)logo.classList.add(b.dataset.play);}));
logo.classList.add('reveal');
</script>
</body>
</html>
