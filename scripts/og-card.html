<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@500&display=swap');
  * { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0B1220;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    position: relative;
  }
  svg.net { position: absolute; inset: 0; width: 100%; height: 100%; }
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px;
  }
  .mark { color: #ffffff; font-size: 44px; font-weight: 600; }
  .latin {
    color: #A8B3C4; font-size: 17px; font-weight: 500;
    font-family: 'IBM Plex Sans', sans-serif;
    letter-spacing: 0.18em; text-transform: uppercase; margin-top: 10px;
    direction: ltr; text-align: right;
  }
  .rule { width: 72px; height: 1px; background: rgba(201,206,214,0.38); margin: 44px 0; }
  .tagline { color: #E6EAF0; font-size: 58px; font-weight: 600; line-height: 1.5; }
  .sub { color: #A8B3C4; font-size: 24px; margin-top: 18px; }
</style>
</head>
<body>
  <svg class="net" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
    <g stroke="#A8B3C4" stroke-width="0.9" fill="none">
      <line x1="180" y1="140" x2="300" y2="230" opacity="0.12"/>
      <line x1="300" y1="230" x2="240" y2="380" opacity="0.11"/>
      <line x1="240" y1="380" x2="360" y2="470" opacity="0.10"/>
      <line x1="300" y1="230" x2="430" y2="180" opacity="0.10"/>
      <line x1="150" y1="520" x2="240" y2="380" opacity="0.12"/>
      <line x1="1050" y1="120" x2="1130" y2="240" opacity="0.10"/>
      <line x1="990" y1="500" x2="1100" y2="430" opacity="0.09"/>
    </g>
    <g fill="#C9CED6">
      <circle cx="180" cy="140" r="3" opacity="0.5"/>
      <circle cx="300" cy="230" r="4.5" opacity="0.9"/>
      <circle cx="240" cy="380" r="3.5" opacity="0.6"/>
      <circle cx="360" cy="470" r="2.5" opacity="0.45"/>
      <circle cx="430" cy="180" r="2.5" opacity="0.4"/>
      <circle cx="150" cy="520" r="2" opacity="0.4"/>
      <circle cx="1050" cy="120" r="2.5" opacity="0.35"/>
      <circle cx="1130" cy="240" r="3.5" opacity="0.5"/>
      <circle cx="990" cy="500" r="2.5" opacity="0.35"/>
      <circle cx="1100" cy="430" r="2" opacity="0.3"/>
      <circle cx="920" cy="320" r="1.8" opacity="0.25"/>
    </g>
  </svg>
  <div class="content">
    <div>
      <div class="mark">كريم معرفة</div>
      <div class="latin">Knowledge Kareem</div>
    </div>
    <div class="rule"></div>
    <div class="tagline">شارك المعرفة.. واصنع الأثر</div>
    <div class="sub">مبادرة داخلية لمشاركة المعرفة بين شركات المجموعة</div>
  </div>
</body>
</html>
